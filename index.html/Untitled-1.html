<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ff4e8a, #ff9a9e, #fad0c4);
    }

    .container{
      text-align:center;
      color:white;
      z-index:2;
    }

    h1{
      font-size:55px;
      animation: kedip 1s infinite alternate;
    }

    @keyframes kedip{
      from{transform:scale(1);}
      to{transform:scale(1.05);}
    }

    p{
      margin-top:15px;
      font-size:22px;
    }

    img{
      width:250px;
      height:250px;
      object-fit:cover;
      border-radius:50%;
      margin-top:20px;
      border:8px solid white;
      box-shadow:0 0 20px rgba(255,255,255,0.8);
    }

    button{
      margin-top:25px;
      padding:12px 25px;
      border:none;
      border-radius:12px;
      background:white;
      color:#ff4081;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.1);
    }

    .confetti{
      position:absolute;
      width:10px;
      height:10px;
      top:-10px;
      animation: jatuh linear infinite;
    }

    @keyframes jatuh{
      to{
        transform:translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>

  <!-- Confetti -->
  <script>
    for(let i=0; i<120; i++){
      let confetti = document.createElement("div");
      confetti.classList.add("confetti");

      document.body.appendChild(confetti);

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
      confetti.style.backgroundColor =
        `hsl(${Math.random() * 360},100%,50%)`;
      confetti.style.width = confetti.style.height =
        (Math.random() * 10 + 5) + "px";
    }
  </script>

  <div class="container">
    <h1>🎉 SELAMAT ULANG TAHUN SAYANG 🎂</h1>

    <p>Semoga harimu penuh kebahagiaan 💖</p>

    <!-- FOTO DARI FOLDER -->
    <img src="apo/foto1.jpeg" alt="Foto">

    <br>

    <!-- PINDAH HALAMAN -->
    <button onclick="pindahHalaman()">
      Klik Ucapan 🎁
    </button>
  </div>

  <script>
    function pindahHalaman(){
      window.location.href = "ucapan.html";
    }
  </script>

</body>
</html>
